[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "google-play-store-project"
version = "0.1.0"
description = "Day 76 of Udemy's 100 Days of Code: analysing Google Play Store data with pandas and Plotly."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
notebook = [
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbclient>=0.10",
    "ipykernel>=6",
]
docs = [
    "kaleido>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=play_store --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
